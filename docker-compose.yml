services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-3dprint}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-3dprint}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: pgsty/silo:RELEASE.2026-11-12T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports: ["8025:8025", "1025:1025"]

  backend:
    build: ./backend
    image: 3dprint_backend
    command: >
      sh -c "python /scripts/init_s3.py &&
             python manage.py migrate --noinput &&
             python manage.py seed_catalog &&
             python manage.py runserver 0.0.0.0:8000"
    env_file: [.env]
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
      MINIO_ENDPOINT: http://minio:9000
      EMAIL_HOST: mailpit
    volumes: ["./backend:/app", "./scripts:/scripts"]
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}

  worker:
    image: 3dprint_backend
    command: python manage.py rqworker default
    env_file: [.env]
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
      MINIO_ENDPOINT: http://minio:9000
      EMAIL_HOST: mailpit
    volumes: ["./backend:/app"]
    depends_on: [backend]

  frontend:
    build: ./frontend
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_PROXY_TARGET: http://backend:8000
      VITE_API_URL: /api
    volumes: ["./frontend:/app", "/app/node_modules"]
    ports: ["5173:5173"]
    depends_on: [backend]

volumes:
  pgdata:
  miniodata:
